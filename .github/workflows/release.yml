# Push a tag like v0.1.0 (matching Product.swift and npm/package.json) to
# test, build the universal binary, attach it to a GitHub release and
# publish the npm package. Publishing uses npm trusted publishing: npm trusts
# this workflow file in TeamDzX/opticensus (set on npmjs.com, package
# settings), so no token is stored. Needs npm 11.5.1+ and Node 22.14+.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write     # the GitHub release
  id-token: write     # trusted publishing and provenance: GitHub vouches for this run to npm
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm new enough for trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: Tag matches the version
        run: |
          v=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/OptiCensusCore/Product.swift)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Product.swift $v"; exit 1; }
      - run: swift test
      - run: scripts/package-npm.sh
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp npm/bin/opticensus opticensus-macos-universal
          # A re-run after a failed publish finds the release already there.
          gh release create "$GITHUB_REF_NAME" opticensus-macos-universal npm/opticensus-*.tgz \
            --title "OptiCensus $GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" opticensus-macos-universal npm/opticensus-*.tgz --clobber
      - name: npm publish
        working-directory: npm
        run: npm publish --provenance --access public
