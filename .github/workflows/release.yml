# Push a tag like v0.1.0 (matching Product.swift and npm/package.json) to
# test, build the universal binary, attach it to a GitHub release and
# publish the npm package. Needs the NPM_TOKEN repository secret.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write     # the GitHub release
  id-token: write     # npm provenance: the package says which commit and workflow built it
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Tag matches the version
        run: |
          v=$(sed -n 's/.*static let version = "\(.*\)".*/\1/p' Sources/OptiCensusCore/Product.swift)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Product.swift $v"; exit 1; }
      - run: swift test
      - run: scripts/package-npm.sh
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp npm/bin/opticensus opticensus-macos-universal
          gh release create "$GITHUB_REF_NAME" opticensus-macos-universal npm/opticensus-*.tgz \
            --title "OptiCensus $GITHUB_REF_NAME" --generate-notes
      - name: npm publish
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
